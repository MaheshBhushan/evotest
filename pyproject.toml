[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evotest"
version = "0.1.0"
description = "Closed-loop multi-language test generation and execution harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.optional-dependencies]
mutation = ["mutmut>=3.8,<4"]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
evotest = "evotest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
